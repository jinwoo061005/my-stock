<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Stock</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- =========================
       메인 화면
  ========================== -->
  <main id="main-screen">

    <header class="top-header">
      <h1>My Stock</h1>
    </header>


    <!-- 총 평가금 -->
    <section class="hero-card">

      <div class="hero-label">총 평가금</div>

      <div id="total-value" class="hero-value">
        ₩0
      </div>

      <div id="total-dollar" class="hero-dollar">
        $0.00
      </div>


      <!-- 현재 보유주식 평가수익 -->
      <div class="main-profit">

        <div class="main-profit-title">
          평가수익
        </div>

        <div
          id="total-profit"
          class="main-profit-value"
        >
          --
        </div>

      </div>


      <div class="profit-detail">

        <div>
          <span>환차익</span>
          <strong id="total-fx-profit">--</strong>
        </div>

        <div>
          <span>판매수익</span>
          <strong id="total-realized-profit">--</strong>
        </div>

      </div>

    </section>


    <!-- =========================
         일간 수익 버튼
    ========================== -->

    <button
      id="daily-profit-button"
      class="daily-open-button"
    >
      <div>
        <span class="button-title">일간 수익</span>
        <span class="button-subtitle">
          오늘 포함 최근 30일
        </span>
      </div>

      <span class="arrow">›</span>
    </button>


    <!-- =========================
         주요 시장
    ========================== -->

    <section class="card market-card">

      <div class="section-title">
        주요 시장
      </div>


      <div class="market-group">

        <div class="market-group-title">
          국내
        </div>

        <div class="market-row">
          <span>KOSPI</span>
          <strong id="kospi">--</strong>
        </div>

        <div class="market-row">
          <span>KOSDAQ</span>
          <strong id="kosdaq">--</strong>
        </div>

      </div>


      <div class="market-group">

        <div class="market-group-title">
          환율
        </div>

        <div class="market-row">
          <span>USD/KRW</span>
          <strong id="usdkrw">--</strong>
        </div>

      </div>


      <div class="market-group">

        <div class="market-group-title">
          미국
        </div>

        <div class="market-row">
          <span>S&P500</span>
          <strong id="sp500">--</strong>
        </div>

        <div class="market-row">
          <span>Nasdaq</span>
          <strong id="nasdaq">--</strong>
        </div>

      </div>

    </section>


    <!-- =========================
         보유 종목
    ========================== -->

    <section>

      <div class="section-title stock-section-title">
        보유 종목
      </div>

      <div id="stocks">

        <div class="stock-card" data-symbol="NVDY">
          <div>
            <div class="stock-name">NVDY</div>
            <div id="NVDY-shares-display" class="stock-shares">
              0주
            </div>
          </div>

          <div class="stock-info">
            <strong id="NVDY-price">--</strong>
            <span id="NVDY-value">--</span>
            <span id="NVDY-profit" class="stock-profit">--</span>
          </div>
        </div>


        <div class="stock-card" data-symbol="QQQM">
          <div>
            <div class="stock-name">QQQM</div>
            <div id="QQQM-shares-display" class="stock-shares">
              0주
            </div>
          </div>

          <div class="stock-info">
            <strong id="QQQM-price">--</strong>
            <span id="QQQM-value">--</span>
            <span id="QQQM-profit" class="stock-profit">--</span>
          </div>
        </div>


        <div class="stock-card" data-symbol="SCHD">
          <div>
            <div class="stock-name">SCHD</div>
            <div id="SCHD-shares-display" class="stock-shares">
              0주
            </div>
          </div>

          <div class="stock-info">
            <strong id="SCHD-price">--</strong>
            <span id="SCHD-value">--</span>
            <span id="SCHD-profit" class="stock-profit">--</span>
          </div>
        </div>


        <div class="stock-card" data-symbol="SPMO">
          <div>
            <div class="stock-name">SPMO</div>
            <div id="SPMO-shares-display" class="stock-shares">
              0주
            </div>
          </div>

          <div class="stock-info">
            <strong id="SPMO-price">--</strong>
            <span id="SPMO-value">--</span>
            <span id="SPMO-profit" class="stock-profit">--</span>
          </div>
        </div>


        <div class="stock-card" data-symbol="SKHY">
          <div>
            <div class="stock-name">SKHY</div>
            <div id="SKHY-shares-display" class="stock-shares">
              0주
            </div>
          </div>

          <div class="stock-info">
            <strong id="SKHY-price">--</strong>
            <span id="SKHY-value">--</span>
            <span id="SKHY-profit" class="stock-profit">--</span>
          </div>
        </div>


        <div class="stock-card" data-symbol="VIG">
          <div>
            <div class="stock-name">VIG</div>
            <div id="VIG-shares-display" class="stock-shares">
              0주
            </div>
          </div>

          <div class="stock-info">
            <strong id="VIG-price">--</strong>
            <span id="VIG-value">--</span>
            <span id="VIG-profit" class="stock-profit">--</span>
          </div>
        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       일간 수익 화면
  ========================== -->

  <main
    id="daily-screen"
    class="screen"
    style="display:none;"
  >

    <header class="sub-header">

      <button id="daily-back-button">
        ←
      </button>

      <div>
        <h2>일간 수익</h2>
        <span>최근 30일</span>
      </div>

    </header>


    <!-- 누적 -->
    <section class="daily-summary">

      <div class="summary-label">
        30일 누적 수익률
      </div>

      <div
        id="daily-total-rate"
        class="summary-rate"
      >
        0.00%
      </div>

    </section>


    <!-- 날짜별 기록 -->
    <section>

      <div
        id="daily-record-list"
        class="daily-record-list"
      ></div>

    </section>


    <div class="daily-edit-help">
      날짜별 수익률을 누르면 직접 수정할 수 있습니다.
    </div>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
